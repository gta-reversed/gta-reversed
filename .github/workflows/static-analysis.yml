name: Static Analysis

env:
  # Compile in parallel where possible.
  CL: /MP

  # Path to the CMake build directory.
  build: "${{ github.workspace }}/build"

# Triggers the workflow on push or pull request events for all branches.
on: [push, pull_request]

permissions:
  contents: read

jobs:
  static-analysis:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025-vs2026]
        conf: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup project via Conan
        uses: ./.github/actions/conan
        with:
          conf: ${{ matrix.conf }}

      - name: Setup CMake
        shell: cmd
        run: cmake --preset conan-default

      - name: Initialize MSVC Code Analysis
        uses: microsoft/msvc-code-analysis-action@24c285ab36952c9e9182f4b78dfafbac38a7e5ee # v0.1.1
        id: analysis
        with:
          cmakeBuildDirectory: ${{ env.build }}
          # Ruleset file that will determine what checks will be run
          ruleset: NativeRecommendedRules.ruleset
          buildConfiguration: ${{ matrix.conf }}
          # Exclude external libraries from analysis
          ignoredPaths: ${{ github.workspace }}/libs

        # Upload SARIF file to GitHub Code Scanning Alerts
      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ steps.analysis.outputs.sarif }}
