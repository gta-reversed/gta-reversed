name: Update progress tracking docs

on:
  push:
     branches:
       - master
     paths:
       - 'source/**'
       - 'contrib/hooks2md.py'
       - '.github/**'

concurrency:
  group: update-re-progress
  cancel-in-progress: true

#
# NOTE #
#
# This workflow requires a GitHub App to be created and installed on the repository, with the following permissions:
# - Read and write contents
# This is because it needs to push to the master branch directly, which is not possible with a normal GitHub token because it's a protected branch.
# So, we need the following: 
# - APP_CLIENT_ID - As a repository **variable**
# - APP_PRIVATE_KEY - As a repository **secret** (The .pem file)
# - The app to be installed in the repository with "contents: read/write" permissions.
#

# All required permissions are granted to the bot already, the workflow itself does not need any additional permissions.
permissions: {}

jobs:
  update-re-progress:
    runs-on: windows-2025-vs2026
    steps:
      - name: Create GitHub App token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      
      - name: Setup Git user for GitHub App
        run: |
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'
          gh auth setup-git
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v7

      - name: Setup project using CMake
        uses: ./.github/actions/setup-cmake
        with:
          os: windows-2025-vs2026
          arch: x86
          conf: Debug # Builds faster, and there's functionally no difference in this case
          preset: Unity
          dump_hooks_only: true
      
      - name: Build standalone executable
        shell: cmd
        run: |
          cmake --build build --config Debug

      - name: Update hooks.csv
        shell: bash
        run: |
          ./bin/Debug/gta_reversed.exe --dump-hooks-to=docs/hooks.csv
          echo "::group::Standalone logs (logs/log.log)"
          cat logs/log.log
          echo "::endgroup::"

      - name: Update ReversedClasses.md
        shell: cmd
        run: |
          python contrib/hooks2md.py --input docs/hooks.csv --output docs/ReversedClasses.md

      - name: Commit and push changes
        run: |
            git add docs/ReversedClasses.md docs/hooks.csv
            git commit -m "ci: Update progress tracking docs [skip ci]"
            git push
