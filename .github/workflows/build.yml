name: Build

env:
  # Compile in parallel where possible.
  CL: /MP

  # Path to the CMake build directory.
  build: "${{ github.workspace }}/build"

# Triggers the workflow on push or pull request events for all branches.
on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025-vs2026]
        arch: [x86]
        conf: [Debug, Release]
        unity: [Unity, NoUnity]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup and build project using Conan
        uses: ./.github/actions/conan
        with:
          arch: ${{ matrix.arch }}
          conf: ${{ matrix.conf }}
          unity_build: ${{ matrix.unity == 'Unity' && 'true' || 'false' }}
          build: true

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gta_reversed-${{ matrix.conf }}-${{ matrix.unity }}
          path: bin/${{ matrix.conf }}
